version: 2

sources:
  - name: raw
    schema: raw
    config:
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 4, period: day}
    tables:
      - name: food_inspections
        description: Raw inspection results and violations from data.boston.gov (raw_api_ingest). Partitioned by _load_date; contains repeated copies across loads, deduped in staging.
      - name: food_licenses
        description: Active food establishment licenses (raw_api_ingest). Full snapshot per _load_date.
      - name: requests_311
        description: 311 service requests (filtered to sanitation / rodent types)
