version: 2

sources:
  - name: raw
    schema: raw
    config:
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 4, period: day}
    tables:
      - name: food_inspections
        description: Raw inspection results and violations from data.boston.gov
        # TODO: set loaded_at_field once the ingestion DAG adds a load timestamp
      - name: food_licenses
        description: Active food establishment licenses
      - name: requests_311
        description: 311 service requests (filtered to sanitation / rodent types)
