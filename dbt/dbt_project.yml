name: boston_inspections
version: "1.0.0"
profile: boston_inspections

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

models:
  boston_inspections:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

seeds:
  boston_inspections:
    +schema: seeds
    food_safety_311_categories:
      +column_types:
        source_system: string
        case_category: string
        is_food_safety: bool
        signal_group: string
        theme: string
        note: string
    neighborhoods:
      +column_types:
        neighborhood_id: string
        neighborhood: string
        acres: float64
        sqmiles: float64
        geometry_geojson: string
